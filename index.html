<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <base target="_blank">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MAWARAN">
  <link rel="apple-touch-icon" href="new-logo.png">
  <meta name="theme-color" content="#ff6600">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAWARAN co</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    /* إخفاء غلاف الصفحة في البداية */
    .page-wrapper {
      display: none;
    }
    :root {
      --transition: 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    }

    /* THEME 1: EMBER — Dark with orange fire */
    [data-theme="ember"] {
      --bg: #080808;
      --bg2: #0f0f0f;
      --card: #141414;
      --card-border: rgba(255,102,0,0.2);
      --accent: #ff6600;
      --accent2: #ff4400;
      --text: #f0ece8;
      --text-muted: #888;
      --glow: rgba(255,102,0,0.3);
      --icon-bg: #1a1200;
      --badge-bg: rgba(255,102,0,0.12);
      --header-line: linear-gradient(90deg, transparent, #ff6600, transparent);
      --logo-filter: brightness(0) invert(1);
      --switcher-bg: rgba(255,255,255,0.05);
      --switcher-border: rgba(255,255,255,0.1);
    }

    /* THEME 2: ARCTIC — Light, clean, icy */
    [data-theme="arctic"] {
      --bg: #f0f4f8;
      --bg2: #e4ecf4;
      --card: #ffffff;
      --card-border: rgba(30,100,200,0.15);
      --accent: #1565c0;
      --accent2: #0d47a1;
      --text: #0a1628;
      --text-muted: #5a7090;
      --glow: rgba(21,101,192,0.2);
      --icon-bg: #e8f0fe;
      --badge-bg: rgba(21,101,192,0.08);
      --header-line: linear-gradient(90deg, transparent, #1565c0, transparent);
      --logo-filter: none;
      --switcher-bg: rgba(0,0,0,0.05);
      --switcher-border: rgba(0,0,0,0.1);
    }

    /* THEME 3: JADE — Dark green luxury */
    [data-theme="jade"] {
      --bg: #060d0a;
      --bg2: #0a130e;
      --card: #0e1a12;
      --card-border: rgba(0,200,100,0.18);
      --accent: #00c864;
      --accent2: #00a050;
      --text: #e8f5ee;
      --text-muted: #6a9a7a;
      --glow: rgba(0,200,100,0.25);
      --icon-bg: #001a0a;
      --badge-bg: rgba(0,200,100,0.1);
      --header-line: linear-gradient(90deg, transparent, #00c864, transparent);
      --logo-filter: brightness(0) invert(1);
      --switcher-bg: rgba(255,255,255,0.05);
      --switcher-border: rgba(255,255,255,0.1);
    }

    /* THEME 4: DARK MODE — Neutral dark */
    [data-theme="dark"] {
      --bg: #111111;
      --bg2: #1a1a1a;
      --card: #1e1e1e;
      --card-border: rgba(200,200,200,0.12);
      --accent: #e0e0e0;
      --accent2: #aaaaaa;
      --text: #f5f5f5;
      --text-muted: #777;
      --glow: rgba(200,200,200,0.08);
      --icon-bg: #2a2a2a;
      --badge-bg: rgba(255,255,255,0.06);
      --header-line: linear-gradient(90deg, transparent, #e0e0e0, transparent);
      --logo-filter: brightness(0) invert(1);
      --switcher-bg: rgba(255,255,255,0.05);
      --switcher-border: rgba(255,255,255,0.1);
    }

    /* ========== RESET & BASE ========== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Vazirmatn', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background-color var(--transition), color var(--transition);
      overflow-x: hidden;
      position: relative;
    }

    /* Animated background pattern */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle at 20% 20%, var(--glow) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, var(--glow) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
      animation: bgPulse 8s ease-in-out infinite alternate;
    }
    @keyframes bgPulse {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }

    /* ========== LAYOUT ========== */
    .page-wrapper {
      position: relative;
      z-index: 1;
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    /* ========== HEADER ========== */
    header {
      text-align: center;
      margin-bottom: 60px;
      animation: fadeDown 0.8s ease both;
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-img {
      max-width: 240px;
      width: 100%;
      height: auto;
      filter: var(--logo-filter);
      transition: filter var(--transition);
      margin-bottom: 18px;
    }

    .header-line {
      width: 200px;
      height: 1px;
      background: var(--header-line);
      margin: 0 auto;
      transition: background var(--transition);
    }

    /* ========== THEME SWITCHER ========== */
    .theme-switcher {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: var(--switcher-bg);
      border: 1px solid var(--switcher-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 10px 8px;
      border-radius: 50px;
      animation: fadeIn 1s ease 0.3s both;
      transition: background var(--transition), border var(--transition);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(-10px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .theme-bar {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .theme-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      outline: none;
      flex-shrink: 0;
    }
    .theme-btn:hover { transform: scale(1.2); }
    .theme-btn.active {
      border-color: var(--text);
      transform: scale(1.25);
      box-shadow: 0 0 8px var(--glow);
    }
    .theme-btn[data-t="ember"] { background: conic-gradient(#ff6600, #ff4400, #cc2200, #ff6600); }
    .theme-btn[data-t="arctic"] { background: conic-gradient(#1565c0, #42a5f5, #0d47a1, #1565c0); }
    .theme-btn[data-t="jade"]   { background: conic-gradient(#00c864, #00a050, #004020, #00c864); }
    .theme-btn[data-t="dark"]   { background: conic-gradient(#444, #888, #222, #444); }

    .switcher-icon {
      width: 16px;
      height: 16px;
      fill: var(--text-muted);
      transition: fill var(--transition);
    }

    @media (max-width: 500px) {
      .theme-switcher {
        top: 12px;
        left: 12px;
        padding: 8px 6px;
        gap: 6px;
      }
      .theme-btn { width: 24px; height: 24px; }
    }

    /* ========== GRID ========== */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    /* Hide empty links */
    .card:has(a[href=""]),
    .card:has(a[href="#"]) { display: none; }

    /* ========== CARD ========== */
    .card {
      animation: cardIn 0.6s ease both;
    }
    .card:nth-child(1) { animation-delay: 0.1s; }
    .card:nth-child(2) { animation-delay: 0.2s; }
    .card:nth-child(3) { animation-delay: 0.3s; }
    .card:nth-child(4) { animation-delay: 0.4s; }
    .card:nth-child(5) { animation-delay: 0.5s; }
    .card:nth-child(6) { animation-delay: 0.6s; }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card a {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 30px 16px 24px;
      transition: all 0.35s cubic-bezier(0.23, 1, 0.32, 1);
      position: relative;
      overflow: hidden;
      gap: 16px;
    }

    .card a::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .card a:hover {
      transform: translateY(-8px);
      border-color: var(--accent);
      box-shadow: 0 20px 60px var(--glow), 0 0 0 1px var(--card-border);
    }
    .card a:hover::before { opacity: 1; }

    /* ========== ICON ========== */
    .icon-wrap {
      width: 80px;
      height: 80px;
      border-radius: 22px;
      background: var(--icon-bg);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      position: relative;
    }

    .card a:hover .icon-wrap {
      background: var(--accent);
      border-color: var(--accent2);
      transform: scale(1.08) rotate(-3deg);
    }

    .icon-wrap svg {
      width: 38px;
      height: 38px;
      fill: var(--accent);
      transition: fill 0.3s ease;
    }
    .card a:hover .icon-wrap svg {
      fill: #ffffff;
    }

    /* ========== LABEL ========== */
    .label {
      font-size: 0.92rem;
      font-weight: 600;
      text-align: center;
      color: var(--text);
      line-height: 1.4;
      letter-spacing: 0.01em;
    }

    /* ========== FOOTER ========== */
    footer {
      text-align: center;
      margin-top: 60px;
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.1em;
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 500px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }
      .card a { padding: 22px 12px 18px; border-radius: 18px; gap: 12px; }
      .icon-wrap { width: 64px; height: 64px; border-radius: 16px; }
      .icon-wrap svg { width: 30px; height: 30px; }
      .label { font-size: 0.82rem; }
    }

    /* ── Service Request Button & Dropdown ── */
    .service-float {
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }
    .svc-sep {
      width: 1px;
      height: 12px;
      background: rgba(255,255,255,0.12);
      margin: 6px auto;
    }
    .svc-trigger {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 10px var(--glow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      outline: none;
      flex-shrink: 0;
    }
    .svc-trigger:hover { transform: scale(1.15); }
    .svc-trigger svg { width: 17px; height: 17px; fill: #fff; }

    .svc-dropdown {
      position: fixed;
      top: 18px;
      left: 74px;
      z-index: 200;
      background: #1a1a1a;
      border: 1px solid rgba(255,102,0,0.25);
      border-radius: 18px;
      padding: 14px;
      width: 210px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      display: none;
      flex-direction: column;
      gap: 12px;
      animation: svcFadeIn 0.2s ease;
    }
    .svc-dropdown.open { display: flex; }
    @keyframes svcFadeIn {
      from { opacity: 0; transform: translateX(-8px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    [data-theme="arctic"] .svc-dropdown {
      background: #fff;
      border-color: rgba(21,101,192,0.2);
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    }

    .svc-name-input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid rgba(255,102,0,0.3);
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      color: #f0ece8;
      font-family: 'Vazirmatn', sans-serif;
      font-size: 14px;
      outline: none;
      text-align: right;
      direction: rtl;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }
    .svc-name-input:focus { border-color: var(--accent); }
    [data-theme="arctic"] .svc-name-input {
      background: #f0f4f8;
      color: #0a1628;
      border-color: rgba(21,101,192,0.3);
    }

    /* ── وتد تنسيق العداد المضاف ── */
    .svc-qty-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 4px;
      font-size: 13px;
    }
    .svc-qty-title {
      font-weight: 600;
      color: var(--text-muted);
    }
    .svc-qty-stepper {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,102,0,0.2);
      border-radius: 8px;
      padding: 2px 8px;
    }
    [data-theme="arctic"] .svc-qty-stepper {
      background: #f0f4f8;
      border-color: rgba(21,101,192,0.2);
    }
    .svc-qty-btn {
      background: transparent;
      border: none;
      color: var(--accent);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      transition: transform 0.1s;
    }
    .svc-qty-btn:active { transform: scale(0.8); }
    #svcQtyDisplay {
      font-weight: 700;
      min-width: 14px;
      text-align: center;
    }

    .svc-btns-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .svc-item-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 8px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-family: 'Vazirmatn', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      transition: transform 0.12s, opacity 0.15s;
    }
    .svc-item-btn:active { transform: scale(0.94); }
    .svc-item-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .svc-item-btn svg { width: 24px; height: 24px; fill: #fff; }

    .svc-item-btn.coffee { background: #6f4e37; }
    .svc-item-btn.tea     { background: #3a7d44; }
    .svc-item-btn.water   { background: #1d6fa4; }
    .svc-item-btn.other   { background: #c2760a; }

    @keyframes svcSpin { to { transform: rotate(360deg); } }
    .svc-item-btn .spin {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: svcSpin 0.7s linear infinite;
      display: none;
    }
    .svc-item-btn.loading .spin { display: block; }
    .svc-item-btn.loading .ic,
    .svc-item-btn.loading .lbl { display: none; }

    @media (max-width: 500px) {
      .svc-dropdown { left: 58px; top: 12px; width: 190px; }
    }
  </style>
</head>
<body data-theme="ember">

<div class="page-wrapper">

  <div class="theme-switcher">
    <svg class="switcher-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
    </svg>
    <div class="theme-bar">
      <button class="theme-btn active" data-t="ember" title="Ember"  onclick="setTheme('ember')"></button>
      <button class="theme-btn"        data-t="arctic" title="Arctic" onclick="setTheme('arctic')"></button>
      <button class="theme-btn"        data-t="jade"   title="Jade"   onclick="setTheme('jade')"></button>
      <button class="theme-btn"        data-t="dark"   title="Dark"   onclick="setTheme('dark')"></button>
    </div>
    <div class="svc-sep"></div>
    <div class="service-float">
      <button class="svc-trigger" id="svcToggle" title="داواکاری خزمەت" onclick="toggleSvcDropdown()">
        <svg viewBox="0 0 24 24"><path d="M12 5c-3.87 0-7 3.13-7 7h14c0-3.87-3.13-7-7-7zm0-2c.55 0 1 .45 1 1v.1C16.92 4.54 20 7.91 20 12v1H4v-1c0-4.09 3.08-7.46 7-7.9V4c0-.55.45-1 1-1zm10 12H2v2h20v-2z"/></svg>
      </button>
    </div>

    <div class="svc-dropdown" id="svcDropdown">
      <input class="svc-name-input" id="svcName" type="text" placeholder="ناوت بنووسە..." autocomplete="off" dir="rtl" />
      
      <div class="svc-qty-row">
        <span class="svc-qty-title">بڕ (دانە):</span>
        <div class="svc-qty-stepper">
          <button type="button" class="svc-qty-btn" onclick="changeSvcQty(-1)">-</button>
          <span id="svcQtyDisplay">1</span>
          <button type="button" class="svc-qty-btn" onclick="changeSvcQty(1)">+</button>
        </div>
      </div>

      <div class="svc-btns-grid">
        <button class="svc-item-btn coffee" onclick="submitSvcRequest('Coffee', this)">
          <svg class="ic" viewBox="0 0 24 24"><path d="M18.5 3H6c-1.1 0-2 .9-2 2v5.71c0 3.83 2.95 7.18 6.78 7.29 3.96.12 7.22-3.06 7.22-7V5c0-1.66-1.34-3-3-3zm-5 8c-.55 0-1-.45-1-1V6c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm4 0c-.55 0-1-.45-1-1V6c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1z"/></svg>
          <span class="lbl">قاوە</span>
          <span class="spin"></span>
        </button>
        <button class="svc-item-btn tea" onclick="submitSvcRequest('Tea', this)">
          <svg class="ic" viewBox="0 0 24 24"><path d="M20 3H4v10c0 2.21 1.79 4 4 4h6c2.21 0 4-1.79 4-4v-3h2c1.11 0 2-.89 2-2V5c0-1.11-.89-2-2-2zm0 5h-2V5h2v3zM4 19h16v2H4z"/></svg>
          <span class="lbl">چای</span>
          <span class="spin"></span>
        </button>
        <button class="svc-item-btn water" onclick="submitSvcRequest('Water', this)">
          <svg class="ic" viewBox="0 0 24 24"><path d="M12 2c-5.33 4.55-8 8.48-8 11.8 0 4.98 3.8 8.2 8 8.2s8-3.22 8-8.2c0-3.32-2.67-7.25-8-11.8z"/></svg>
          <span class="lbl">ئاو</span>
          <span class="spin"></span>
        </button>
        <button class="svc-item-btn other" onclick="submitSvcRequest('Other', this)">
          <svg class="ic" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
          <span class="lbl">داواکاری تر</span>
          <span class="spin"></span>
        </button>
      </div>
    </div>
  </div>
  


  <header>
    <img src="Asset_1.png" alt="MAWARAN" class="logo-img">
    <div class="header-line"></div>
  </header>

  <div class="grid">

    <div class="card">
      <a href="https://itmawaran-gif.github.io/map/" target="_blank">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z"/>
          </svg>
        </div>
        <div class="label">نەخشە</div>
      </a>
    </div>

    <div class="card">
      <a href="https://docs.google.com/spreadsheets/d/134hfr2dw-z1F_nGppfje9Hbqwjsp7u-bo7D35ELeSPQ/edit?usp=sharing" target="_blank">

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzDavNg9Jy7Ijn3Hh2zYfI_yiAXNa2NQ8mdFcaQonqPQIa-FmPHsRLXQ0oDsex3InUY/exec";

async function checkPassword() {
    const wrapper = document.querySelector('.page-wrapper');
    const saved = localStorage.getItem("mawaran_auth");

    if (saved === "true") {
        wrapper.style.display = "block";
        return;
    }

    let input = prompt("🔒 Enter password:");

    if (!input) {
        alert("Password is required to access this site.");
        location.reload();
        return;
    }

    try {
        const response = await fetch(`${SCRIPT_URL}?password=${encodeURIComponent(input)}`);
        const data = await response.json();

        if (data.success === true || data.result === "success") {
            localStorage.setItem("mawaran_auth", "true");
            alert("✔ Logged in");
            wrapper.style.display = "block";
        } else {
            alert("❌ Incorrect password");
            document.body.innerHTML = "<h2 style='text-align:center;margin-top:100px; color:white;'>Access Denied</h2>";
        }
    } catch (error) {
        console.error("Error:", error);
        alert("Connection error. Please try again.");
    }
}

window.addEventListener("DOMContentLoaded", checkPassword);

function setTheme(t) {
    document.body.dataset.theme = t;
    localStorage.setItem('mawaran-theme', t);
    document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.t === t);
    });
}

(function() {
    const saved = localStorage.getItem('mawaran-theme') || 'ember';
    setTheme(saved);
})();

// ── Service Request (Quick Panel) ──
const SVC_GAS = 'https://script.google.com/macros/s/AKfycbx4rzBnuYsYrzXRgfFYeGnkWoQUQWmFjH-IYIdEjxdHcpxyQncSf9-JgoY37QUdogpnUg/exec';
const SVC_FB_CFG = {
  apiKey:"AIzaSyC_zyJginS-_nUfFAXsAWNbYxMteOi1m3E",
  authDomain:"company-service-6faaf.firebaseapp.com",
  projectId:"company-service-6faaf",
  storageBucket:"company-service-6faaf.firebasestorage.app",
  messagingSenderId:"726705809159",
  appId:"1:726705809159:web:becb04cc61222b513c87a2"
};

let svcDb = null;
let svcSending = false;
let svcQty = 1; // متغير الكمية الافتراضية للوحة الخدمة

function initSvcFirebase() {
  if (svcDb) return;
  if (!window.firebase) return;
  try {
    const app = firebase.apps.length
      ? firebase.apps[0]
      : firebase.initializeApp(SVC_FB_CFG);
    svcDb = firebase.firestore(app);
  } catch(e) { console.error('SVC Firebase init:', e); }
}

function toggleSvcDropdown() {
  const d = document.getElementById('svcDropdown');
  const open = d.classList.toggle('open');
  if (open) {
    // إعادة تعيين الكمية إلى 1 عند فتح النافذة المنسدلة من جديد
    svcQty = 1;
    document.getElementById('svcQtyDisplay').textContent = svcQty;

    if (!window.firebase) {
      const s1 = document.createElement('script');
      s1.src = 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js';
      s1.onload = () => {
        const s2 = document.createElement('script');
        s2.src = 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js';
        s2.onload = initSvcFirebase;
        document.head.appendChild(s2);
      };
      document.head.appendChild(s1);
    } else {
      initSvcFirebase();
    }
    const saved = localStorage.getItem('mawaran_svc_name') || '';
    const inp = document.getElementById('svcName');
    if (saved) inp.value = saved;
    setTimeout(() => { if (!saved) inp.focus(); }, 100);
  }
}

// التحكم بالكمية الزيادة والنقصان للوحة المصغرة
function changeSvcQty(amount) {
  svcQty += amount;
  if (svcQty < 1) svcQty = 1;
  if (svcQty > 10) svcQty = 10;
  document.getElementById('svcQtyDisplay').textContent = svcQty;
}

document.addEventListener('click', e => {
  const drop = document.getElementById('svcDropdown');
  const btn  = document.getElementById('svcToggle');
  const sw   = document.querySelector('.theme-switcher');
  if (!drop || !drop.classList.contains('open')) return;
  if (!sw.contains(e.target) && !drop.contains(e.target)) {
    drop.classList.remove('open');
  }
});

document.addEventListener('DOMContentLoaded', () => {
  const inp = document.getElementById('svcName');
  if (!inp) return;
  inp.addEventListener('input', () => {
    const v = inp.value.trim();
    if (v) localStorage.setItem('mawaran_svc_name', v);
  });
});

function svcTypeLabel(t) {
  return { Coffee:'قاوە', Tea:'چای', Water:'ئاو', Other:'داواکاری تر' }[t] || t;
}

async function submitSvcRequest(type, btn) {
  const name = document.getElementById('svcName').value.trim();
  if (!name) {
    document.getElementById('svcName').focus();
    document.getElementById('svcName').style.borderColor = '#ff4400';
    setTimeout(() => document.getElementById('svcName').style.borderColor = '', 1200);
    return;
  }
  if (svcSending) return;
  svcSending = true;
  btn.classList.add('loading');
  btn.disabled = true;

  try {
    if (!svcDb) throw new Error('DB not ready');
    
    // إضافة حقل الكمية هنا لقاعدة بيانات الطلبات في فايرستور
    await svcDb.collection('requests').add({
      employee: name,
      type: type,
      quantity: svcQty, 
      status: 'pending',
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });

    // إرسال الإشعار مع دمج رمز الكمية الجديدة
    const snap = await svcDb.collection('fcm_tokens').where('role','==','service').get();
    if (!snap.empty) {
      const tokens = snap.docs.map(d => d.data().token);
      await fetch(SVC_GAS, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ 
          tokens, 
          title: 'داواکاری نوێ 🔔', 
          body: `${name}: ${svcTypeLabel(type)} ×${svcQty}` 
        }),
      });
    }

    btn.style.opacity = '1';
    const orig = btn.innerHTML;
    btn.classList.remove('loading');
    btn.innerHTML = '<svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:#fff"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';
    
    // إعادة تصفير الكمية بعد نجاح العملية مباشرة
    svcQty = 1;
    document.getElementById('svcQtyDisplay').textContent = 1;

    setTimeout(() => { btn.innerHTML = orig; btn.disabled = false; svcSending = false; }, 1800);
    setTimeout(() => document.getElementById('svcDropdown').classList.remove('open'), 2000);
  } catch(err) {
    console.error(err);
    btn.classList.remove('loading');
    btn.disabled = false;
    btn.style.boxShadow = '0 0 0 2px #ff4400';
    setTimeout(() => btn.style.boxShadow = '', 1500);
    svcSending = false;
  }
}
</script>
